# The example executable ran with this yaml is meant to simulate a scenario  
# where the simulation state is restored from a checkpoint after a failure. 
# After, the simulation continues to run for (duration - elapsed_time) seconds
# where duration is the intended duration of the simulation, and elapsed_time
# is the amount of seconds the simulation ran before failing. 

# duration in seconds
duration: 10
# global [height, width] (excluding boundary conditions or ghosts)
datasize: [420, 60]
# degree of parallelism
parallelism: { height: 3, width: 1 }
# status for recovery 
veloc_checkpoint_status : 0 

pdi:
  include:
  - pdi.yml
  data: # type of values for which PDI does not keep a copy
    veloc_checkpoint_status : int
    elapsed_offset : double
  plugins:
    veloc:
      config_file: veloc_example.cfg # needed for VeloC internal config 
      checkpoint_label : example # needed by VeloC to checkpoint-recover 
      iteration : iter # needed by VeloC to checkpoint 
      status : veloc_checkpoint_status  
      managed_checkpointing:
        protect_data: [iter, main_field,elapsed_offset] # data to be checkpointed or recovered, iter must be included
        synchronize_on_event: newiter # PDI_event to check status and consequently checkpoint/recover
        when : '$iter % 1000 = 0'

