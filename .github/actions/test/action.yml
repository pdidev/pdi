name: Test PDI
description: 'Test PDI'
inputs:
  image:
    required: true
    description: "docker image in which to run the test"
runs:
  using: "composite"
  steps:
    - id: test
      shell: bash
      run: |
        if [[ "01234567" == *"$(echo "${{github.run_id}}"|md5sum|cut -b 1)"* ]]; then export CMAKE_FLAGS="-DINSTALL_PDIPLUGINDIR=/tmp/pdi_plugins"; fi
        export MAKEFLAGS='-j 4'
        STATUS=0
        ./bin/build_and_run_all_tests --container "${{inputs.image}}" --ctest-outdir tests_output || STATUS=$?
        if compgen -G 'tests_output/tests_*.xml' > /dev/null
        then echo "with_report=true" >> "$GITHUB_OUTPUT"
        else echo "with_report=false" >> "$GITHUB_OUTPUT"
        fi
        exit "${STATUS}"
    - id: Publish
      uses: mikepenz/action-junit-report@v6
      if: always() && steps.test.outputs.with_report == 'true'
      with:
        report_paths: 'tests_output/tests_*.xml'
