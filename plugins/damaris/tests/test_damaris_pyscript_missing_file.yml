# 2 Damaris clients + 1 Damaris server core (mpirun -np 3), see test_write_pyscript.c
pdi:
  metadata:
    iter:      int
    psize:     int
    prank:     int
    mpi_comm:  MPI_Comm
    is_client: int
  data:
    values: { size: 8, type: array, subtype: int }
  plugins:
    mpi:
    damaris:
      architecture:
        sim_name: pyscript_test
        domains: 1
        dedicated:
          core: 1
          node: 0
      client_comm_get: mpi_comm
      get_is_client: is_client
      datasets:
        - dataset:
            name: values
            layout: values_layout
            script: TestPyScript
      layouts:
        - layout:
            name: values_layout
            type: int
            dimensions: [ '8' ]
            global: [ '8*$psize' ]
            depends_on: [psize]
      pyscript:
        name: TestPyScript
        language: python
        frequency: 2                # run on iterations 0, 2, 4 only
        execution: remote
        scope: core
        external: false
        nthreads: 1
        timeout: 4
        keep_workers: no
        comment: pyscript test
      write:
        values:
          position: [ '8*$prank' ]
      log:
        file_name: pyscript_test
        rotation_size: 5
        log_level: info
        flush: true
