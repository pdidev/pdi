parallelism: 3
localsize: 10

logging: debug
pdi:
  metadata:
    mpi_comm: MPI_Comm
    is_client: int
    dsize: int
    psize: int
    pcoord: int
  data:
    int_values: {size: ["$dsize"], type: array, subtype: int}
  plugins:
    trace: info
    mpi:
    decl_hdf5:
      - file: 'data_iter0.h5'
        communicator: $mpi_comm
        on_event: write
        datasets: # type of the datasets to create in file
          int_values:
            type: array
            subtype: int
            size: ['$psize*$dsize']
        write:
          int_values: # the name of the data to write
            dataset: int_values
            mpio: COLLECTIVE # or INDEPENDENT
            memory_selection:
              size:  ['$dsize']
              start: [0]
            dataset_selection:
              size:  ['$dsize']
              start: ['$dsize*$pcoord']
    damaris:
      architecture:
        sim_name: damaris_scalar_type
        domains: 1
        dedicated:
          core: 1
          node: 0
      get_is_client: is_client
      client_comm_get: mpi_comm
      datasets:
        - dataset:
            name: int_values
            layout: int_values_layout
            storage: hdf5_storage
      layouts:
        - layout:
            name: int_values_layout
            type: int
            global: ["$psize*$dsize"]
            dimensions: ["$dsize"]
            ghosts: '0:0'
            depends_on: [psize, dsize]
      storages:
        - storage:
            name: hdf5_storage
            type: HDF5
            file_mode: Collective
            files_path: ./HDF5_files/
      write: 
        int_values:
          dataset: int_values
          position: ["$dsize*$pcoord"]
      log:
        rotation_size: 5
        log_level: info
        flush: true