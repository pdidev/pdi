parallelism: 6
localsize: 1

logging: debug
pdi:
  metadata:
    mpi_comm: MPI_Comm
    is_client: int
    dsize: int
    psize: int
    pcoord: int
  data:
    int_values: {size: ["$dsize"], type: array, subtype: int}
  plugins:
    trace: info
    mpi:
    decl_hdf5:
      - file: 'data_iter0_${pcoord}.h5'
        on_event: write
        write: [dsize, int_values]
    damaris:
      architecture:
        sim_name: damaris_scalar_type
        domains: 1
        dedicated:
          core: 2
          node: 0
      get_is_client: is_client
      client_comm_get: mpi_comm
      datasets:
        - dataset:
            name: int_values
            layout: int_values_layout
            storage: hdf5_storage
      layouts:
        - layout:
            name: int_values_layout
            type: int
            global: ["$psize*$dsize"]
            dimensions: ["$dsize"]
            ghosts: '0:0'
            depends_on: [psize, dsize]
      storages:
        - storage:
            name: hdf5_storage
            type: HDF5
            file_mode: FilePerCore
            files_path: ./HDF5_files/
      write: 
        int_values:
          dataset: int_values
          position: ["$dsize*$pcoord"]
      log:
        rotation_size: 5
        log_level: info
        flush: true